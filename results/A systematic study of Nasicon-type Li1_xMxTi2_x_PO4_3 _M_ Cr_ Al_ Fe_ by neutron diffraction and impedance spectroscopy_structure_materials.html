.2 \\times 10^{-3}$  S cm<sup>-1</sup> at room temperature and activation energy of 0.30 eV, which is comparable with those measured in the best ionic conductors reported to date.", "title": "Electrical Properties and Ionic Conductivity", "type": "semantic_group", "src": "", "parent_id": "0017"}, "0026": {"text": "The impedance spectroscopy measurements allowed us to relate the electrical properties to the observations of the crystal structure.", "title": "The impedance spectroscopy measurements ...", "type": "sentence", "src": "", "parent_id": "0025"}, "kw_0019": {"text": "Herein, we report the structural changes that take place in these systems as a consequence of the migration of lithium ions and their influence on the electrical properties.", "title": "electrical properties", "type": "keyword", "src": "", "parent_id": "0068"}, "kw_0020": {"text": "Crystal structure of samples Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 along the conduction path, M1–M2′–M1, where the M1 and M2′ sites are shown.", "title": "Crystal structure", "type": "keyword", "src": "", "parent_id": "0207"}, "0027": {"text": "Both dc bulk and grain boundary ionic conductivity show a thermally activated behavior, and their values increase with substituent content until compositions of x = 0.2–0.3.", "title": "Both dc bulk and grain boundary ionic co...", "type": "sentence", "src": "", "parent_id": "0025"}, "kw_0021": {"text": "Both dc bulk and grain boundary ionic conductivity show a thermally activated behavior, and their values increase with substituent content until compositions of x = 0.2–0.3.", "title": "grain boundary ionic conductivity", "type": "keyword", "src": "", "parent_id": "0027"}, "kw_0022": {"text": "Both dc bulk and grain boundary ionic conductivity show a thermally activated behavior, and their values increase with substituent content until compositions of x = 0.2–0.3.", "title": "thermally activated behavior", "type": "keyword", "src": "", "parent_id": "0027"}, "0028": {"text": "The activation energy for bulk dc conductivity hardly changes with the substitution, and the main factor affecting the variation of the ionic conductivity is the pre-exponential factor.", "title": "The activation energy for bulk dc conduc...", "type": "sentence", "src": "", "parent_id": "0025"}, "kw_0023": {"text": "Table 2 Activation energy, pre-exponential factor and ionic conductivity at room temperature in the bulk and grain boundaries obtained from Arrhenius fit.", "title": "Activation energy", "type": "keyword", "src": "", "parent_id": "0283"}, "kw_0024": {"text": "Pre-exponential factors determined from the Arrhenius fits of the bulk dc conductivity for the different samples as a function of the order parameter |M1–M2′| / (M1 + M2′) in site occupation factors as determined from neutron diffraction data.", "title": "bulk dc conductivity", "type": "keyword", "src": "", "parent_id": "0300"}, "kw_0025": {"text": "Table 2 Activation energy, pre-exponential factor and ionic conductivity at room temperature in the bulk and grain boundaries obtained from Arrhenius fit.", "title": "pre-exponential factor", "type": "keyword", "src": "", "parent_id": "0283"}, "0029": {"text": "We find indeed a correlation between the pre-exponential factor and the degree of disorder of the lithium atoms in the structure as determined from neutron diffraction data.", "title": "We find indeed a correlation between the...", "type": "sentence", "src": "", "parent_id": "0025"}, "kw_0026": {"text": "In fact, in the case of Cr and Fe systems, when  $x \\ge 0.2$ , the fraction of ions in M2' is higher than in M1, giving rise to an intermediate situation between  $LiTi_2(PO_4)_3$  and  $Li_3M_2(PO_4)_3$ , but with a higher degree of disorder [33,34].", "title": "degree of disorder", "type": "keyword", "src": "", "parent_id": "0177"}, "kw_0027": {"text": "Pre-exponential factors determined from the Arrhenius fits of the bulk dc conductivity for the different samples as a function of the order parameter |M1–M2′| / (M1 + M2′) in site occupation factors as determined from neutron diffraction data.", "title": "neutron diffraction data", "type": "keyword", "src": "", "parent_id": "0300"}, "0030": {"text": "The highest conductivity was found in the sample Li<sub>1.3</sub>Al<sub>0.3</sub>Ti<sub>1.7</sub>(PO<sub>4</sub>)<sub>3</sub> with a value of  $6.2 \\times 10^{-3}$  S cm<sup>-1</sup> at room temperature and activation energy of 0.30 eV, which is comparable with those measured in the best ionic conductors reported to date.", "title": "The highest conductivity was found in th...", "type": "sentence", "src": "", "parent_id": "0025"}, "kw_0028": {"text": "Fig. 6. (a) Conductivity versus frequency and (b) Nyquist plot at 163 K of the sample Li1.3Fe0.3Ti1.7(PO4)3.", "title": "Conductivity", "type": "keyword", "src": "", "parent_id": "0262"}, "kw_0029": {"text": "Table 2 Activation energy, pre-exponential factor and ionic conductivity at room temperature in the bulk and grain boundaries obtained from Arrhenius fit.", "title": "room temperature", "type": "keyword", "src": "", "parent_id": "0283"}, "kw_0030": {"text": "The highest conductivity was found in the sample Li<sub>1.3</sub>Al<sub>0.3</sub>Ti<sub>1.7</sub>(PO<sub>4</sub>)<sub>3</sub> with a value of  $6.2 \\times 10^{-3}$  S cm<sup>-1</sup> at room temperature and activation energy of 0.30 eV, which is comparable with those measured in the best ionic conductors reported to date.", "title": "activation energy of 0.30 eV", "type": "keyword", "src": "", "parent_id": "0030"}, "kw_0031": {"text": "The highest conductivity was found in the sample Li<sub>1.3</sub>Al<sub>0.3</sub>Ti<sub>1.7</sub>(PO<sub>4</sub>)<sub>3</sub> with a value of  $6.2 \\times 10^{-3}$  S cm<sup>-1</sup> at room temperature and activation energy of 0.30 eV, which is comparable with those measured in the best ionic conductors reported to date.", "title": "ionic conductors", "type": "keyword", "src": "", "parent_id": "0030"}, "0031": {"text": "© 2014 Elsevier B.V. All rights reserved.", "title": "Copyright Information", "type": "semantic_group", "src": "", "parent_id": "0017"}, "0032": {"text": "© 2014", "title": "© 2014...", "type": "sentence", "src": "", "parent_id": "0031"}, "0033": {"text": "Elsevier B.V.", "title": "Elsevier B.V....", "type": "sentence", "src": "", "parent_id": "0031"}, "0034": {"text": "All rights reserved.", "title": "All rights reserved....", "type": "sentence", "src": "", "parent_id": "0031"}, "0035": {"text": "Lithium-based solid electrolytes have been extensively studied in the last decades for their application in batteries and fuel cells [1–7]. Specifically, its high potential and low weight makes lithium the best candidate for high-energy density storage batteries. In the search for fast lithium ionic conductors, different materials have been optimized. Nasicon-type materials (Na Superlonic CONductor) were first discovered as three-dimensional sodium ionic conductors [8]. Since then, many studies have focused on the development of Nasicon materials with optimized ionic conductivity and high stability. In particular, NASICON-type materials with Li<sup>+</sup> ions occupying the open channels in the structure were investigated as promising candidates for lithium batteries. LiTi<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub> and its derivatives are among the best options due to the small size of the Ti<sup>4+</sup> that makes the size of the sites in the channels more appropriate for lithium ions [9–15].\n\nE-mail address: estebanez@itam.cas.cz (M. Pérez-Estébanez).\n\nThe crystal structure of LiTi<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub> is based on the Nasicon rhombohedral structure (S.G.  $R\\overline{3}c$ ) and can be described as formed by infinite ribbons of [Ti<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub>] units with [102] orientation. These ribbons are composed of alternate corner-sharing [TiO<sub>6</sub>] octahedra and [PO<sub>4</sub>] tetrahedra. As reported in the literature, Li<sup>+</sup> ions may occupy two interstitial positions within this network, the so-called M1 site,  $6\\mathbf{b}$  (0, 0, 0), and the M2 sites, 18e(x, 0, 1/4). The M1 site is sixfold coordinated by oxygen atoms, and the M2 site has an eightfold coordination. Both sites alternate along the channels forming a three-dimensional conduction network. The different connectivity makes the relative occupancy of M1 and M2 sites a key factor to determine the ionic transport of the NASICON materials. When all the M1 sites are occupied by lithium, all the pathways for long-range ion motion are blocked by the own ionic carriers, as in the case of LiTi<sub>2</sub>(PO<sub>4</sub>)<sub>3</sub> compound, where Li<sup>+</sup> ions occupy preferentially the low connectivity M1 positions [16,17]. The appropriate substitution of Ti<sup>4+</sup> with trivalent metals like Al<sup>3+</sup>, Fe<sup>3+</sup> or Cr<sup>3+</sup> has successfully improved the ionic conductivity in this system as a consequence of different factors. It promotes the occupancy of M2 sites, liberating part of the formerly blocked M1 sites and expanding the ionic conduction pathways in such a way that ions can now percolate the sample [14]. Also, it produces an increase in the carrier (Li<sup>+</sup>) content, and it enhances\n\n<sup>\\*</sup> Corresponding author at: Tel.: + 420 567 225 322. Centre of Excellence Telč, Batelovská 485-6, 58 856 Telč, Czech Repubic.\n\nthe lithium conductivity at grain boundaries due to higher densification during material processing [\\[18,19\\]](#page-7-0).\n\nSeveral studies describe the disposition of lithium atoms in Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 compounds studied by neutron powder diffraction (NPD) and nuclear magnetic resonance (NMR), but only selected stoichiometries have been reported, and to our best knowledge, no systematic study exists to date [\\[14,20](#page-7-0)–23]. In this work, powders of composition Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 for 0 ≤ x ≤ 1 have been synthesized using a sol–gel synthesis route. A systematic study of the structural characteristics and electrical properties of the prepared samples has been carried out using X-ray powder diffraction (XRPD), neutron powder diffraction (NPD) and impedance spectroscopy. Herein, we report the structural changes that take place in these systems as a consequence of the migration of lithium ions and their influence on the electrical properties.", "title": "1. Introduction", "type": "section", "src": "", "parent_id": null}, "0036": {"text": "Lithium-based solid electrolytes have been extensively studied in the last decades for their application in batteries and fuel cells [1–7]. Specifically, its high potential and low weight makes lithium the best candidate for high-energy density storage batteries. In the search for fast lithium ionic conductors, different materials have been optimized.", "title": "Introduction to Lithium Solid Electrolytes", "type": "semantic_group", "src": "", "parent_id": "0035"}, "0037": {"text": "Lithium-based solid electrolytes have been extensively studied in the last decades for their application in batteries and fuel cells [1–7].", "title": "Lithium-based solid electrolytes have be...", "type": "sentence", "src": "", "parent_id": "0036"}, "kw_0032": {"text": "Lithium-based solid electrolytes have been extensively studied in the last decades for their application in batteries and fuel cells [1–7].", "title": "Lithium-based solid electrolytes", "type": "keyword", "src": "", "parent_id": "0037"}, "kw_0033": {"text": "Lithium-based solid electrolytes have been extensively studied in the last decades for their application in batteries and fuel cells [1–7].", "title": "batteries", "type": "keyword", "src": "", "parent_id": "0037"}, "kw_0034": {"text": "Lithium-based solid electrolytes have been extensively studied in the last decades for their application in batteries and fuel cells [1–7].", "title": d solution of CA whose pH was previously adjusted to 8, to promote ionization and complexation of titanium. After total dissolution, the rest of the reactants were added to the solution, and subsequently, the appropriate amount of EG was mixed with the solution. The temperature was then increased to 413 K to promote polyesterification. During heating, solutions became more viscous until a polymeric gel was formed. The obtained gel was heated up to 673 K until a dark powder precursor was obtained. The resultant precursors were heated at 1073 K during 4 h. This yielded samples of composition Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 with selected values of x in the range of 0 ≤ x ≤ 1 (termed LATP for Al, LCTP for Cr and LFTP for Fe samples followed by the x value in the general formula).", "title": "2.1. Sample preparation", "type": "section", "src": "", "parent_id": null}, "0070": {"text": "Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 samples with 0 ≤ x ≤ 1 and M = Al, Cr and Fe were prepared by the Pechini method [\\[24\\]](#page-7-0).", "title": "Introduction to Samples and Method", "type": "semantic_group", "src": "", "parent_id": "0069"}, "0071": {"text": "Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 samples with 0 ≤ x ≤ 1 and M = Al, Cr and Fe were prepared by the Pechini method", "title": "Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup...", "type": "sentence", "src": "", "parent_id": "0070"}, "kw_0084": {"text": "Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 samples with 0 ≤ x ≤ 1 and M = Al, Cr and Fe were prepared by the Pechini method", "title": "0 ≤ x ≤ 1", "type": "keyword", "src": "", "parent_id": "0071"}, "kw_0085": {"text": "On the other hand, the variation of the pre-exponential factor follows the sequence Al N Fe N Cr.", "title": "Al", "type": "keyword", "src": "", "parent_id": "0250"}, "kw_0086": {"text": "On the other hand, the variation of the pre-exponential factor follows the sequence Al N Fe N Cr.", "title": " .2 (M= Fe) were successfully synthesized as pure phases at 1073 K using the Pechini synthesis method.", "title": "1073 K", "type": "keyword", "src": "", "parent_id": "0272"}, "kw_0118": {"text": "The resultant precursors were heated at 1073 K during 4 h.", "title": "4 h", "type": "keyword", "src": "", "parent_id": "0083"}, "0084": {"text": "This yielded samples of composition Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 with selected values of x in the range of 0 ≤ x ≤ 1 (termed LATP for Al, LCTP for Cr and LFTP for Fe samples followed by the x value in the general formula).", "title": "This yielded samples of composition Li1+...", "type": "sentence", "src": "", "parent_id": "0082"}, "kw_0119": {"text": "Dashed lines indicate the presence of secondary phases (AlPO<sub>4</sub> in LATP and Nasicon monoclinic in LCTP and LFTP systems).", "title": "LATP", "type": "keyword", "src": "", "parent_id": "0152"}, "kw_0120": {"text": "Dashed lines indicate the presence of secondary phases (AlPO<sub>4</sub> in LATP and Nasicon monoclinic in LCTP and LFTP systems).", "title": "LCTP", "type": "keyword", "src": "", "parent_id": "0152"}, "kw_0121": {"text": "This yielded samples of composition Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 with selected values of x in the range of 0 ≤ x ≤ 1 (termed LATP for Al, LCTP for Cr and LFTP for Fe samples followed by the x value in the general formula).", "title": "LFTP", "type": "keyword", "src": "", "parent_id": "0084"}, "kw_0122": {"text": "From the values of the site occupation factors in Table 1, it can be deduced that the Li<sup>+</sup> ions are displaced from M1 site to M2' site with increasing the x value, which results in a higher delocalization of lithium within the structure, since the M2' sites are of bigger size.", "title": "x value", "type": "keyword", "src": "", "parent_id": "0176"}, "0085": {"text": "XRPD patterns of the synthesized powders were collected at room temperature in a PANalytical X′Pert PRO instrument using CuKα<sup>1</sup> radiation with a PW 3050/60 goniometer. Continuous scan with a virtual step size of 0.033° (2θ) and a counting time of 350 s was employed in the range of 2θ = 10–120°. The instrumental parameters were previously calibrated using the LaB6 standard NIST SRM 660b.\n\nHigh-resolution neutron diffraction experiments were carried out at selected temperatures between 77 and 540 K using the instruments HRPT [\\[25\\]](#page-7-0) and E9 [\\[26\\]](#page-7-0) of the European facilities PSI and HZB, respectively. Approximately 3 g of the sample was placed in a vanadium cylindrical holder with a thickness of 6 mm. At HRPT, data were collected in a 2θ range of 4 to 165° with a step of 0.05° and λ = 1.494 Å. At E9, the range 3° to 142° with integration steps of 0.07° was measured with λ = 1.799 Å. X-ray and neutron diffraction data were analyzed using the Rietveld method implemented in the Fullprof software [\\[27\\].](#page-7-0) The neutron powder diffraction data were refined, according to the Nasicon-type structure, starting with a structural model with the atoms that make up the skeleton of the structure, i.e., Ti/M, P, O1 and O2, in 12c (0, 0, 0.14), 18e (0.29, 0, 1/4), 36f (0.18, 0.99, 0.19) and (0.19, 0.16, 0.19) sites, respectively. Atomic coordinates were then refined while the profile parameters were kept constant. Based on this model, different Fourier's maps were calculated. These maps show the scattering density difference between the real structure and the model and, from them, the positions of the atoms missing in the starting model—lithium atoms—can be determined. Since lithium has negative coherent scattering length for neutrons, it shows up as negative scattering density in Fourier's maps.", "title": "2.2. Structural characterization", "type": "section", "src": "", "parent_id": null}, "0086": {"text": "XRPD patterns of the synthesized powders were collected at room temperature in a PANalytical X′Pert PRO instrument using CuKα<sup>1</ : "0121"}, "0122": {"text": "[PDF: 0111–-078-1106] that was previously reported in LiZr2(PO4)3 [\\[28\\].](#page-7-0)", "title": "[PDF: 0111–-078-1106] that was previousl...", "type": "sentence", "src": "", "parent_id": "0116"}, "kw_0193": {"text": "[PDF: 0111–-078-1106] that was previously reported in LiZr2(PO4)3 [\\[28\\].](#page-7-0)", "title": "LiZr2(PO4)3", "type": "keyword", "src": "", "parent_id": "0122"}, "0123": {"text": "When M = Cr and Fe, the monoclinic Nasicon phase is formed as secondary phase when x = 0.4, 0.5, with increased intensity, and finally as single phase when x = 1.", "title": "Observations in Chromium and Iron Systems", "type": "semantic_group", "src": "", "parent_id": "0110"}, "0124": {"text": "When M = Cr and Fe, the monoclinic Nasicon phase is formed as secondary phase when x = 0.4, 0.5, with increased intensity, and finally as single phase when x = 1.", "title": "When M = Cr and Fe, the monoclinic Nasic...", "type": "sentence", "src": "", "parent_id": "0123"}, "kw_0194": {"text": "When M = Cr and Fe, the monoclinic Nasicon phase is formed as secondary phase when x = 0.4, 0.5, with increased intensity, and finally as single phase when x = 1.", "title": "monoclinic Nasicon phase", "type": "keyword", "src": "", "parent_id": "0124"}, "kw_0195": {"text": "This is an indication of a small amount of a secondary phase.", "title": "secondary phase", "type": "keyword", "src": "", "parent_id": "0164"}, "kw_0196": {"text": "When M = Cr and Fe, the monoclinic Nasicon phase is formed as secondary phase when x = 0.4, 0.5, with increased intensity, and finally as single phase when x = 1.", "title": "single phase", "type": "keyword", "src": "", "parent_id": "0124"}, "0125": {"text": "Samples observed as singles phases in [Fig. 1](#page-2-0), i.e., with x ≤ 0.4 when M = Al and x ≤ 0.3 when M = Cr and Fe, were studied by powder neutron diffraction at room temperatures. Three selected samples, LTP, LATP03 and LCTP02, were also studied at variable temperatures from 77 to 540 K. The first stage of the Rietveld data treatment was the refinement of the structural skeleton, i.e., Ti/M, P and O atoms as described in the experimental part. Different Fourier maps were then calculated. [Fig. 2](#page-3-0) shows, as an example, the different Fourier maps in the xy plane with z = 0 obtained for the LATP samples at selected temperatures. In these maps, the M1 position described in the literature (0,0,0) is seen as a well-defined negative scattering density in the LTP sample at 77 K. The increase of the temperature gives rise to the expansion of the negative scattering density. On the other hand, the substitution of Ti4+ by trivalent metals also produces the expansion of the negative scattering density in the M1 position that is completely delocalized when x ≥ 0.3 [\\(Fig. 2](#page-3-0)). Lithium atoms were then added to the model in the M1 position. The high values of thermal coefficients (B) obtained and the delocalization observed in the Fourier maps led us to refine them anisotropically. The anisotropic B coefficients of the Li+ atoms in M1 brought out a preference thermal displacement on the xy plane and negligible along the z direction due to the presence of the [Ti/MO6] octahedra. Other authors described this finding as the movement of atoms from M1 to a general position around [\\[20\\].](#page-7-0) Equivalent behavior was found with temperature and substitution in Cr and Fe systems.\n\nFurther analysis of the different Fourier maps revealed negative scattering density due to the additional Li+ atoms, with the maximum located at position (0.47(3), 0.31(1), 0.25(1)) in all samples except in LTP (see Fig. S1). This position is close to the M2 (0.53, 0, ¼) described in the literature but displaced in b direction from the centre of the polyhedron. In the following, this position will be termed M2′. Li<sup>+</sup>\n\n<span id=\"page-2-0\"></span>![](_page_2_Figure_2.jpeg)\n\n![](_page_2_Figure_3.jpeg)\n\n![](_page_2_Figure_4.jpeg)\n\n**Fig. 1.** XRPD patterns obtained at room temperature in samples  $\\text{Li}_{1+x}\\text{M}_x\\text{Ti}_{2-x}(\\text{PO}_4)_3$  with  $0 \\le x \\le 1$  and (a) M = Al, (b) M = Cr and (c) M = Fe. Dashed lines indicate the presence of secondary phases (AlPO<sub>4</sub> in LATP and Nasicon monoclinic in LCTP and LFTP systems).\n\natoms in M2′ position (Li2′) were added to the structural model during the data analysis. The atomic coordinates and site occupation factors (s.o.f.) of M1 and M2′ were refined constraining the *B* coefficients to the isothermal ones obtained for Li1. The s.o.f. of Li1 and Li2′, as well as M and Ti, were also constrained to have the sum according to the expected stoichiometry. Fig. 3 shows, as an example, the fitted neutron diffraction pattern of LATPO1 sample at room temperature.\n\nIn Fig. 4, the unit cell is represented along the conduction path M1–M2′–M1 and the Li $^+$  atoms in M1 (Li1) and M2′ (Li2′) are indicated. In Fig. 4, the displacement of the M2′ position from the previously reported data is noticeable. The fact that we observed a displaced position of M2 together with the highly anisotropic thermal displacement of Li $^+$  in M1 is an evidence of the high mobility of lithium atoms within the structure.\n\nTable 1 shows the refined cell parameters, atomic coordinates and occupation factors of Li atoms, as well as the agreement factors of each sample at room temperature and two of them at different temperatures. Additional information (atomic coordinates, Biso and s.o.f. of the atoms which shape the structural skeleton) is shown in Tables S1 and S2 of the supplementary materials. It is worth noting that the obtained occupation factors of M/Ti show that the degree of substitution is in all cases somewhat lower than expected from stoichiometry, with increasing tendency toward higher substituent content. This is an indication of a small amount of a secondary phase. In fact, on the sample LFTP03, a small amount of the monoclinic phase of Li<sub>2</sub>FeTi(PO<sub>4</sub>)<sub>3</sub>  $(SG:P2_1/n)$  was found (3.6(2)% wt.), which was not detected previously in the XRPD pattern. The experimental values of their cell parameters,  $a \\approx 8.602(1) \\text{ Å}, b \\approx 11.986(2) \\text{ Å}, c \\approx 8.533(1) \\text{ Å} and$  $\\beta \\approx 90.052(5)$ , are in good agreement with the values reported in the literature [29].\n\nIn general, the variation in the cell parameters is in good agreement with the ionic radii of the different substituents ( $r(Al^{3+}) = 0.535 \\text{ Å}$ ,  $r(\\text{Ti}^{4+}) = 0.605 \\text{ Å}, r(\\text{Cr}^{3+}) = 0.615 \\text{ Å}, r(\\text{Fe}^{3+}) = 0.645 \\text{ Å}) [30],$ increasing with the x value in Cr and Fe systems and decreasing in the Al system. Although there are other factors affecting the cell parameters, such as the disposition of Li<sup>+</sup> ions, it has been reported that the ionic radii of substituents is the fundamental limitation [31,32], which proves that in fact substitution of Ti<sup>4+</sup> takes place. From the values of the site occupation factors in Table 1, it can be deduced that the Li<sup>+</sup> ions are displaced from M1 site to M2' site with increasing the x value, which results in a higher delocalization of lithium within the structure, since the M2' sites are of bigger size. In fact, in the case of Cr and Fe systems, when  $x \\ge 0.2$ , the fraction of ions in M2' is higher than in M1, giving rise to an intermediate situation between  $LiTi_2(PO_4)_3$  and  $Li_3M_2(PO_4)_3$ , but with a higher degree of disorder [33,34]. Especially significant is the liberation of ions from M1 that is observed in the samples with lowest x values, with site occupation factors varying from 0.167 (when x = 0) to 0.114, 0.125 and 0.083 (when x = 0.05) and M = Al, Cr and Fe, respec-\n\nThe diffraction experiments made at different temperatures let us to study the thermal expansion of the samples. The thermal expansion coefficients of materials with similar composition have been reported to be dependent on the synthesis method [35,36]. Fig. 5 shows the variation of cell parameters of different samples at various temperatures. As can be seen, the variation of c lattice parameter with temperature is significant, while a remains nearly constant (varies less than 0.2%). Thermal\n\nexpansion coefficients were calculated as  $\\alpha = \\frac{l_2 - l_1}{l_1 \\left( T_2 - T_1 \\right)}$ , where  $l_1$  and  $l_2$ \n\nare the cell parameters at temperatures  $T_1$  and  $T_2$ , respectively, and values of  $\\alpha_c \\sim 1.5 \\times 10^{-5} \\, \\mathrm{K}^{-1}$  and  $\\alpha_a \\sim 0$  were obtained. From the analysis of the bond distances, the size of the M1 cavity has been found to increase along the c direction and decrease along a, with temperature. This behavior, previously observed by Alamo et al.0[37], provokes cooperative rotations of [TiO<sub>6</sub>] octahedra and [PO<sub>4</sub>] tetrahedra. On the other hand, the obtained values of the occupation factor of Li<sup>+</sup> in M1 and M2' shows a small displacement from M1 to M2' with temperature.", "title": "3.2. Neutron diffraction as a function of temperature", "type": "section", "src": "", "parent_id": null}, "0126": {"text": "Samples observed as singles phases in [Fig. 1](#page-2-0), i.e., with x ≤ 0.4 when M = Al and x ≤ 0.3 when M = Cr and Fe, were studied by powder neutron diffraction at room temperatures. Three selected samples, LTP, LATP03 and LCTP02, were also studied at variable temperatures from 77 to 540 K. The first stage of the Rietveld data treatment was the refinement of the structural skeleton, i.e., Ti/M, P and O atoms as described in the experimental part. Different Fourier maps were then calculated.", "title": "Experimental Setup and Initial Rietveld Processing", "type": "semantic_group", "src": "", "parent_id": "0125"}, "0127": {"text": "Samples observed as singles phases in [Fig. 1](#page-2-0), i.e., with x ≤ 0.4 whe )3 forces the Li+ ions to occupy a new position different from M1, which have been determined by NPD as M2′. Even at low substitution levels (x = 0.05), the release of M1 and simultaneous occupation of M2′ has been observed.", "title": "Ti", "type": "keyword", "src": "", "parent_id": "0274"}, "kw_0248": {"text": "It is worth noting that the obtained occupation factors of M/Ti show that the degree of substitution is in all cases somewhat lower than expected from stoichiometry, with increasing tendency toward higher substituent content.", "title": "stoichiometry", "type": "keyword", "src": "", "parent_id": "0163"}, "0156": {"text": "Fig. 3 shows, as an example, the fitted neutron diffraction pattern of LATPO1 sample at room temperature.", "title": "Fig. 3 shows, as an example, the fitted ...", "type": "sentence", "src": "", "parent_id": "0142"}, "kw_0249": {"text": "Fig. 3 shows, as an example, the fitted neutron diffraction pattern of LATPO1 sample at room temperature.", "title": "neutron diffraction pattern", "type": "keyword", "src": "", "parent_id": "0156"}, "kw_0250": {"text": "Fig. 3 shows, as an example, the fitted neutron diffraction pattern of LATPO1 sample at room temperature.", "title": "LATPO1 sample", "type": "keyword", "src": "", "parent_id": "0156"}, "0157": {"text": "In Fig. 4, the unit cell is represented along the conduction path M1–M2′–M1 and the Li $^+$  atoms in M1 (Li1) and M2′ (Li2′) are indicated.", "title": "In Fig. 4, the unit cell is represented ...", "type": "sentence", "src": "", "parent_id": "0142"}, "kw_0251": {"text": "In Fig. 4, the unit cell is represented along the conduction path M1–M2′–M1 and the Li $^+$  atoms in M1 (Li1) and M2′ (Li2′) are indicated.", "title": "unit cell", "type": "keyword", "src": "", "parent_id": "0157"}, "kw_0252": {"text": "This small variation may be due to changes in the size of the electrochemical window in the conduction path.", "title": "conduction path", "type": "keyword", "src": "", "parent_id": "0237"}, "0158": {"text": "In Fig. 4, the displacement of the M2′ position from the previously reported data is noticeable.", "title": "In Fig. 4, the displacement of the M2′ p...", "type": "sentence", "src": "", "parent_id": "0142"}, "kw_0253": {"text": "On the other hand, the obtained values of the occupation factor of Li<sup>+</sup> in M1 and M2' shows a small displacement from M1 to M2' with temperature.", "title": "displacement", "type": "keyword", "src": "", "parent_id": "0187"}, "0159": {"text": "The fact that we observed a displaced position of M2 together with the highly anisotropic thermal displacement of Li $^+$  in M1 is an evidence of the high mobility of lithium atoms within the structure.", "title": "The fact that we observed a displaced po...", "type": "sentence", "src": "", "parent_id": "0142"}, "kw_0254": {"text": "The fact that we observed a displaced position of M2 together with the highly anisotropic thermal displacement of Li $^+$  in M1 is an evidence of the high mobility of lithium atoms within the structure.", "title": "anisotropic thermal displacement", "type": "keyword", "src": "", "parent_id": "0159"}, "kw_0255": {"text": "The fact that we observed a displaced position of M2 together with the highly anisotropic thermal displacement of Li $^+$  in M1 is an evidence of the high mobility of lithium atoms within the structure.", "title": "high mobility", "type": "keyword", "src": "", "parent_id": "0159"}, "kw_0256": {"text": "Fig. 9 shows that a correlation indeed exists between the values of the pre-exponential factor and the degree of order in the structure for all the samples, independent of the substitution level.", "title": "structure", "type": "keyword", "src": "", "parent_id": "0268"}, "0160": {"text": "Table 1 shows the refined cell parameters, atomic coordinates and occupation factors of Li atoms, as well as the agreement factors of each sample at room temperature and two of them at different temperatures. Additional information (atomic coordinates, Biso and s.o.f. of the atoms which shape the structural skeleton) is shown in Tables S1 and S2 of the supplementary materials. It is worth noting that the obtained occupation factors of M/Ti show that the degree of substitution is in all cases somewhat lower than expected from stoichiometry, with increasing tendency toward higher substituent content. This is an indication of a small amount of a secondary phase. In fact, on the sample LFTP03, a small amount of the monoclinic phase of Li<sub>2</sub>FeTi(PO<sub>4</sub>)<sub>3</sub>  $(SG:P2_1/n)$  was found (3.6(2)% wt.), which was not detected previously in the XRPD pattern. The experimental values of their cell parameters,  $a \\approx 8.602(1) \\text{ Å}, b \\approx 11.986(2) \\text{ Å}, c \\approx 8.533(1) \\text{ Å} and$  $\\beta \\approx 90.052(5)$ , are in good agreement with the values reported in the literature [29]. In general, the variation in the cell parameters is in good agreement with the ionic radii of the different substituents ( $r(Al^{3+}) = 0.535 \\text{ Å}$ ,  $r(\\text{Ti}^{4+}) = 0.605 \\text{ Å}, r(\\text{Cr}^{3+}) = 0.615 \\text{ Å}, r(\\text{Fe}^{3+}) = 0.645 \\text{ Å}) [30],$ increasing with the x value in Cr and Fe systems and decreasing in the Al system. Although there are other factors affecting the cell parameters, such as the disposition of Li<sup>+</sup> ions, it has been reported that the ionic radii of substituents is the fundamental limitation [31,32], which proves that in fact substitution of Ti<sup>4+</sup> takes place. From the values of the site occupation factors in Table 1, it can be deduced that the Li<sup>+</sup> ions are displaced from M1 site to M2' site with increasing the x value, which results in a higher delocalization of lithium within the structure, since the M2' sites are of bigger size. In fact, in the case of Cr and Fe systems, when  $x \\ge 0.2$ , the fraction of ions in M2' is higher than in M1, giving rise to an intermediate situation between  $LiTi_2(PO_4)_3$  and  $Li_3M_2(PO_4)_3$ , but with a higher degree of disorder [33,34]. Especially significant is the liberation of ions from M1 that is observed in the samples with lowest x values, with site occupation factors varying from 0.167 (when x = 0) to 0.114, 0.125 and 0.083", "title": "Analysis of Refined Parameters and Compositional Effects on Lithium Distribution", "type": "semantic_group", "src": "", "parent_id": "0125"}, "0161": {"text": "Table 1 shows the refined cell parameters, atomic coordinates and occupation factors of Li atoms, as well as the agreement factors of each sample at room temperature and two of them at different temperatures.", "title": "Table 1 shows the refined cell parameter...", "type": "sentence", "src": "", "parent_id": "0160"}, "kw_0257": {"text": "Variation of cell parameters with temperature.", "title": "cell parameters", "type": "keyword", "src": "", "parent_id": "0255"}, "kw_0258": {"text": "The relation of the occupation factors |M1–M2′| / (M1 + M2′) is thus a measure of the order in the lithium", "title": "occupation factors", "type": "keyword", "src": "", "parent_id": "0260"}, "kw_0259": {"text": "Table 1 shows the refined cell parameters, atomic coordinates and occupation factors of Li atoms, as well as the agreement factors of each sample at room temperature and two of them at different temperatures.", "title": "Li atoms", "type": "keyword", "src": "", "parent_id": "0161"}, "kw_0260": {"text": "Thus,\n\n<span id=\"page-5-0\"></span>Table 1 Refined results of cell parameters, atomic coordinates and site occupation factor of Li+ ions and agreement factors for different samples at room temperature.", "title": "agreement factors", "type": "keyword", "src": "", "parent_id": "0241"}, "kw_0261": {"text": "Table 1 shows the refined cell parameters, atomic coordinates and occupation factors of Li atoms, as well as the agreement factors of each sample at room temperature and two of them at different temperatures.", "title": "differ ions of [TiO<sub>6</sub>] octahedra and [PO<sub>4</sub>] tetrahedra.", "title": "This behavior, previously observed by Al...", "type": "sentence", "src": "", "parent_id": "0179"}, "kw_0295": {"text": "This behavior, previously observed by Alamo et al.0[37], provokes cooperative rotations of [TiO<sub>6</sub>] octahedra and [PO<sub>4</sub>] tetrahedra.", "title": "cooperative rotations", "type": "keyword", "src": "", "parent_id": "0186"}, "0187": {"text": "On the other hand, the obtained values of the occupation factor of Li<sup>+</sup> in M1 and M2' shows a small displacement from M1 to M2' with temperature.", "title": "On the other hand, the obtained values o...", "type": "sentence", "src": "", "parent_id": "0179"}, "kw_0296": {"text": "On the other hand, the obtained values of the occupation factor of Li<sup>+</sup> in M1 and M2' shows a small displacement from M1 to M2' with temperature.", "title": "M2'", "type": "keyword", "src": "", "parent_id": "0187"}, "0188": {"text": "The charge dynamics of the samples was investigated by complex impedance measurements. The wide ranges of frequency and temperature used have allowed us to separate the bulk dc and grain boundary mechanisms of the electrical conductivity. Fig. 6a shows, as an example, the plot of the real part of the conductivity versus frequency of the\n\n<span id=\"page-3-0\"></span>![](_page_3_Figure_2.jpeg)\n\nFig. 2. Different Fourier maps in the xy plane with z = 0 of the neutron diffraction data at selected temperatures, obtained from Rietveld refinement of the Ti/Al-P-O skeleton of the samples Li1+ <sup>x</sup>AlxTi2 <sup>−</sup> <sup>x</sup>(PO4)3. Remaining scattering length densities are shown blue when negative, orange when positive.\n\nrepresentative LFTP03 sample. The spectra of all the samples show the typical features of ionic transport: (i) a dispersive regime in the low-frequency range at the highest temperatures due to the blocking of the mobile ions in electrodes, (ii) a plateau at higher frequencies corresponding to grain boundary electrical transport followed by a dispersive regime and (iii) a new plateau due to the long-range or dc bulk\n\n<span id=\"page-4-0\"></span>![](_page_4_Figure_2.jpeg)\n\nFig. 3. Experimental, calculated and different NPD patterns obtained at room temperature of the sample LAPT01; bars indicate the position of Bragg peaks.\n\nionic conductivity, which is followed again by a dispersive regime at the highest frequencies. In [Fig. 6b](#page-5-0), the Nyquist plot, Z″ versus Z′, of the same sample at 163 K is shown where the three different conductive regimes described above can be also distinguished: (i) a straight line at high Z′ (low-frequency values) shows the blocking of ionic carriers in the metallic electrodes, (ii) a big semicircle at medium frequencies evidences the grain boundary conductivity and (iii) a small semicircle close to the origin (high frequency, see inset of [Fig. 6](#page-5-0)b) shows the bulk contribution to the conductivity. In some samples, especially in the aluminum ones, the different conductivity regimes—bulk and grain boundary are difficult to distinguish using these representations. The overlap of both semicircles in these kinds of samples arises because bulk and\n\n![](_page_4_Figure_5.jpeg)\n\nFig. 4. Crystal structure of samples Li1+ <sup>x</sup>MxTi2 <sup>−</sup> <sup>x</sup>(PO4)3 along the conduction path, M1–M2′–M1, where the M1 and M2′ sites are shown.\n\ngrain boundary contributions to the conductivity are very close in frequency. This can be ascribed to low electrical homogeneity of the samples and makes it necessary to use different representations of the conductivity data [\\[38,39\\]](#page-7-0). The electrical modulus is simply related to the permittivity, M\\*=1/ ε\\*, and it is a very convenient representation in this case because the spectrum is dominated by the lowest capacity element and therefore the maximum at each temperature describes the bulk response of the sample [\\[40,41\\]](#page-7-0). [Fig. 7](#page-6-0) shows the frequency dependence of the imaginary part of the electrical modulus for LFTP03 sample at different temperatures. The maxima of the spectra are asymmetric, evidencing the dispersion of the electrical conductivity at the high frequency side of the peak and indicating the existence of correlation effects in the conductivity [\\[42](#page-7-0)–45]. These correlation effects are a consequence of the existence of interactions among the moving ionic carriers (ion–ion interactions) since they are charged and have to compete for the vacant positions in the structure, giving rise a non-Debye relaxation process [\\[46\\].](#page-7-0) The frequency value at the peak corresponds to the end of the plateau of the dc conductivity in the conductivity representation and can be used as a criterion to determine the bulk dc conductivity. Using the combination of both representations, we are able to extract the bulk and grain boundary conductivity values at different temperatures for each sample and represent it in an Arrhenius plot. We calculated the long-range or dc conductivity σdc, as the σ′ value at the precise frequency of the peak of the modulus. The grain boundary values σgb are much easier to determine since this regimen extends several decades in frequency in all the samples, as it is shown in [Fig. 6a](#page-5-0), and can be extracted from the plateau in the conductivity representation. The results are shown in [Fig. 8](#page-6-0) for selected samples. Lines in [Fig. 8](#page-6-0) are fits to the equation σdc ∙ T = σ<sup>0</sup> exp(−Ea / kBT), where σ<sup>0</sup> is the pre-exponential factor, Ea is the activation energy and kB is the Boltzman constant. All samples follow the Arrhenius law, and from the fitting, we obtained Ea, σ<sup>0</sup> and conductivity values at room temperature of each mechanism, see [Table 2.](#page-6-0)\n\nAs it is noticeable in [Table 2,](#page-6-0) the electrical conductivity generally increases with substitution. Especially important is the increase observed with the lowest levels of substituents, x = 0.05, compared with the sample with x = 0. The highest conductivity values were found for x = 0.3 in aluminum and iron substituted samples and for x = 0.2 in the chromium samples, corresponding to the lowest activation energy of grain boundaries, which approach the values of the bulk. In systems where the inter- and intra-grain activation energy is similar, differences in conductivity are normally related to the connectivity between grains, which have a higher concentration of imperfections near the grain boundary [\\[47\\].](#page-7-0) In this work, the maximum conductivity is found in the sample Li1.3Al0.3Ti1.7(PO4)3 (σ<sup>b</sup> =6.2 × 10−<sup>3</sup> S cm−<sup>1</sup> and σgb =7.3 × 10−<sup>5</sup> S cm−<sup>1</sup> at room temperature), which is in fact the most studied composition of the LiTi2(PO4)3 derivatives. However, other authors found maxima values in samples with x = 0.2 or x = 0.5 [\\[14,26\\].](#page-7-0)\n\nAs can be seen in [Table 2](#page-6-0), grain boundary conductivity values are two or three orders of magnitude smaller than those in the bulk. The small conductivity of grain boundary is related to the low density of the samples. The calculated density varies from 45% (LTP) to 70% (LATP03) of the theoretical density. The highest values were found in LATP samples. In the three systems studied, the density is increased by increasing the substitution level.\n\nThe variation of activation energy with composition in the bulk is smaller than in the grain boundaries. This small variation may be due to changes in the size of the electrochemical window in the conduction path. Li+ ions placed in M1 site are surrounded by six oxygen atoms inside an antiprism and the jump to M2′ sites implies passing through the lateral face of this site which constitutes the bottleneck of the conduction path [\\[48\\]](#page-7-0). [Table 2](#page-6-0) shows that the nature of the substituent does not affect significantly the size of the bottleneck because the activation energy of bulk conduction decreases with the substitution content in the three systems independently of the ionic radii of substituent. Thus,\n\n<span id=\"page-5-0\"></span>Table 1 Refined results of cell parameters, atomic coordinates and site occupation factor of Li+ ions and agreement factors for different samples at room temperature. Data obtained at different temperature for samples LATP03 and LCTP02 is also added in italics.\n\n|         | a (Å)     | c(Å)        | Li1<br>s.o.f. | Li2′      |           |           |          | Rb   | Rwp  |\n|---------|-----------|-------------|---------------|-----------|-----------|-----------|----------|------|------|\n|         |           |             |               | s.o.f.    | x         | y         | z        |      |      |\n| LTP     | 8.5087(1) | 20.9089(4)  | 0.167         | –         | –         | –         | –        | 2.34 | 8.01 |\n| LATP005 | 8.5066(1) | 20.9085(3)  | 0.114(4)      | 0.061(4)  | 0.202(9)  | 0.033(10) | 0.089(3) | 3.00 | 8.70 |\n| LATP01  | 8.5068(1) | 20.8905(3)  | 0.116(3)      | 0.067(3)  | 0.199(8)  | 0.034(8)  | 0.089(3) | 3.18 | 8.50 |\n| LATP03  | 8.4941(1) | 20.8586(4)  | 0.113(5)      | 0.104(5)  | 0.143(12) | 0.036(10) | 0.104(6) | 2.87 | 8.57 |\n| 77 K    | 8.4886(1) | 20.7839(5)  | 0.115(5)      | 0.102(5)  | 0.213(11) | 0.010(8)  | 0.071(3) | 2.70 | 9.08 |\n| 423 K   | 8.4918(1) | 20.9125(1)  | 0.105(6)      | 0.111(6)  | 0.215(11) | 0.015(9)  | 0.070(4) | 3.95 | 12.9 |\n| 540 K   | 8.4939(1) | 20.9750(5)  | 0.081(6)      | 0.136(6)  | 0.196(10) | 0.006(8)  | 0.066(3) | 4.27 | 12.2 |\n| LATP04  | 8.4882(2) | 20.8571(7)  | 0.065(8)      | 0.168(8)  | 0.203(9)  | 0.018(8)  | 0.075(3) | 4.05 | 11.7 |\n| LCTP005 | 8.5093(1) | 20.9150(5)  | 0.125(5)      | 0.050(5)  | 0.232(14) | 0.033(19) | 0.072(7) | 2.36 | 8.58 |\n| LCTP01  | 8.5126(1) | 20.9212(4)  | 0.112(4)      | 0.071(4)  | 0.197(8)  | 0.034(8)  | 0.091(3) | 3.14 | 8.77 |\n| LCTP02  | 8.5132(2) | 20.9271(6)  | 0.063(6)      | 0.137(6)  | 0.198(9)  | 0.025(8)  | 0.073(3) | 2.86 | 9.82 |\n| 77 K    | 8.5043(2) | 20.8405(7)  | 0.062(7)      | 0.138(7)  | 0.201(6)  | 0.026(8)  | 0.077(3) | 2.82 | 9.85 |\n| 423 K   | 8.5064(2) | 20.9712(7)  | 0.066(7)      | 0.134(7)  | 0.209(9)  | 0.029(10) | 0.075(4) | 3.86 | 12.2 |\n| 540 K   | 8.5090(2) | 21.0332(9)  | 0.047(10)     | 0.153(10) | 0.214(10) | 0.029(11) | 0.081(4) | 4.28 | 14.5 |\n| LCTP03  | 8.5183(3) | 20.9177(10) | 0.071(6)      | 0.140(5)  | 0.198(9)  | 0.016(9)  | 0.071(4) | 3.50 | 13.3 |\n| LFTP005 | 8.5125(1) | 20.8871(5)  | 0.083(5)      | 0.092(5)  | 0.225(8)  | 0.028(10) | 0.073(4) | 2.60 | 8.49 |\n| LFTP01  | 8.5137(1) | 20.8822(3)  | 0.107(3)      | 0.076(3)  | 0.198(7)  | 0.034(7)  | 0.090(2) | 3.02 | 8.45 |\n| LFTP02  | 8.5213(1) | 20.9211(5)  | 0.082(5)      | 0.118(5)  | 0.217(8)  | 0.010(9)  | 0.075(3) | 2.47 | 9.64 |\n| LFTP03  | 8.5239(1) | 20.9215(4)  | 0.099(3)      | 0.117(5)  | 0.187(6)  | 0.019(7)  | 0.090(2) | 2.83 | 8.86 |\n\nthe variation of the activation energy is due to the different location of Li<sup>+</sup> ions, changing from M1 to M2′ sites as demonstrated by NPD. When M1 sites are empty, repulsion forces between oxygen atoms are increased, extending the M1 site and increasing the size of the bottleneck [\\[49\\].](#page-7-0)\n\nConsidering the different substituents present in the samples, the highest bulk conductivity values have been obtained in the aluminum samples, where the lowest activation energy and highest preexponential factors were found. Looking at the activation energy, the lowest values have been found in the aluminum system followed by chromium and iron. This sequence agrees with the increase of the ionic radii, which seems to be the determinant factor. On the other hand, the variation of the pre-exponential factor follows the sequence Al N Fe N Cr. The pre-exponential factor can be described as:\n\n$$\\sigma_0 = \\frac{4\\alpha e^2 \\alpha^2 \\nu_0 N e^{S/k_B}}{k_B}$$\n\nwhere α is a geometrical factor, a is the jump distance, v<sup>0</sup> is the attempt frequency, Nis the concentration of carriers, S is a configurational entropy term, e is the electron charge and k<sup>B</sup> is the Boltzmann constant. Since the\n\n![](_page_5_Figure_8.jpeg)\n\nFig. 5. Variation of cell parameters with temperature. Theoretical variation with α<sup>c</sup> = 1.5 × 10−<sup>5</sup> K−<sup>1</sup> is added as dot line.\n\nstructure remains extremely similar and we are very slightly varying lithium content, we consider the configurational entropy term as the most probable cause of the differences observed in [Table 2](#page-6-0), over one order of magnitude [\\[50\\].](#page-7-0) Taking into account the occupation factors obtained from the neutron diffraction data, Li+ ions are displaced to the M2′ sites with substitution. The relation of the occupation factors |M1–M2′| / (M1 + M2′) is thus a measure of the order in the lithium\n\n![](_page_5_Figure_11.jpeg)\n\nFig. 6. (a) Conductivity versus frequency and (b) Nyquist plot at 163 K of the sample Li1.3Fe0.3Ti1.7(PO4)3.\n\n<span id=\"page-6-0\"></span>![](_page_6_Figure_2.jpeg)\n\nFig. 7. Modulus versus frequency plot of sample Li1.3Fe0.3Ti1.7(PO4)3.\n\noccupation in the structure. Thus, the configurational entropy increases with the disorder for Li+ ions and takes its maximum when the value of the order parameter |M1–M2′| / (M1 + M2′) is zero, i.e., M1 and M2′ are equal. According to this relation, the lowest ratio |M1–M2′| / (M1 + M2′) is for the sample LATP03, which has the higher preexponential factor of the series. Fig. 9 shows that a correlation indeed exists between the values of the pre-exponential factor and the degree of order in the structure for all the samples, independent of the substitution level. There is a clear trend showing the exponential increase of the pre-exponential factor with increasing disor rain boundary conductivity values are two or three orders of magnitude smaller than those in the bulk. The small conductivity of grain boundary is related to the low density of the samples. The calculated density varies from 45% (LTP) to 70% (LATP03) of the theoretical density. The highest values were found in LATP samples. In the three systems studied, the density is increased by increasing the substitution level. The variation of activation energy with composition in the bulk is smaller than in the grain boundaries. This small variation may be due to changes in the size of the electrochemical window in the conduction path. Li+ ions placed in M1 site are surrounded by six oxygen atoms inside an antiprism and the jump to M2′ sites implies passing through the lateral face of this site which constitutes the bottleneck of the conduction path [\\[48\\]](#page-7-0). [Table 2](#page-6-0) shows that the nature of the substituent does not affect significantly the size of the bottleneck because the activation energy of bulk conduction decreases with the substitution content in the three systems independently of the ionic radii of substituent.", "title": "Analysis of Conductivity, Activation Energy, and Substitution Effects", "type": "semantic_group", "src": "", "parent_id": "0188"}, "0226": {"text": "As it is noticeable in [Table 2,](#page-6-0) the electrical conductivity generally increases with substitution.", "title": "As it is noticeable in [Table 2,](#page-...", "type": "sentence", "src": "", "parent_id": "0225"}, "0227": {"text": "Especially important is the increase observed with the lowest levels of substituents, x = 0.05, compared with the sample with x = 0.", "title": "Especially important is the increase obs...", "type": "sentence", "src": "", "parent_id": "0225"}, "kw_0371": {"text": "Especially important is the increase observed with the lowest levels of substituents, x = 0.05, compared with the sample with x = 0.", "title": "x = 0.05", "type": "keyword", "src":         const plotData = [{"x": 3.354, "y": -2.208, "text": "LATP (25°C)", "id": 0, "group": "Ceramic"}, {"x": 3.354, "y": -2.208, "text": "LATP03 (25°C)", "id": 1, "group": "Ceramic"}];
        
        // --- PLOTLY SETUP ---
        function initPlot() {
            if (plotData.length === 0) {
                document.getElementById('arrhenius-plot').innerHTML = '<div style="padding:2rem; text-align:center; color:#999">No plottable data (Missing Temperature or Conductivity)</div>';
                return;
            }

            // Group data by material class for coloring
            const groups = {};
            plotData.forEach(p => {
                if (!groups[p.group]) groups[p.group] = { x: [], y: [], text: [], ids: [] };
                groups[p.group].x.push(p.x);
                groups[p.group].y.push(p.y);
                groups[p.group].text.push(p.text);
                groups[p.group].ids.push(p.id);
            });

            const traces = Object.keys(groups).map(g => ({
                x: groups[g].x,
                y: groups[g].y,
                text: groups[g].text,
                customdata: groups[g].ids,
                mode: 'markers',
                type: 'scatter',
                name: g,
                marker: { size: 10, opacity: 0.7 }
            }));

            const layout = {
                title: 'Arrhenius Plot (Log σ vs 1000/T)',
                margin: { t: 40, r: 20, l: 60, b: 50 },
                hovermode: 'closest',
                xaxis: { title: '1000 / T (K⁻¹)' },
                yaxis: { title: 'log₁₀(σ) (S/cm)' },
            };

            Plotly.newPlot('arrhenius-plot', traces, layout, {responsive: true});

            // Click Event
            document.getElementById('arrhenius-plot').on('plotly_click', function(data){
                const pt = data.points[0];
                const matIndex = pt.customdata;
                selectMaterial(matIndex);
                
                // Scroll sidebar to item
                const sidebarItem = document.getElementById(`mat-${matIndex}`);
                if(sidebarItem) sidebarItem.scrollIntoView({behavior: 'smooth', block: 'center'});
            });
        }

        // --- INTERACTION LOGIC ---
        function selectMaterial(index) {
            // Sidebar UI
            document.querySelectorAll('.mat-item').forEach(el => el.classList.remove('active'));
            const item = document.getElementById(`mat-${index}`);
            if(item) item.classList.add('active');
            
            // Render Detail
            renderDetail(index);
            
            // Highlight on Plot (if exists)
            // We use the 'customdata' property (which holds the ID) to find the point index
            // Note: This is a simplistic highlight that re-styles all points. 
            // Ideally use Plotly.restyle but filtering through traces is complex.
            // For now, we rely on the user visually matching or using the hover.
        }

        function renderDetail(index) {
            const mat = materials[index];
            const elName = mat.electrolyte_name || {};
            
            // Link Logic
            const sentId = mat.source_sentence_id;
            const nodeId = mat.source_node ? mat.source_node.node_id : null;
            
            let linkHtml = '<span style="color:#999">N/A</span>';
            if (sentId && sourceMap[sentId]) {
                linkHtml = `<a href="#" class="source-link" onclick="showSource('${sentId}', '${nodeId}'); return false;">${sentId} (View Text)</a>`;
            } else if (nodeId && sourceMap[nodeId]) {
                linkHtml = `<a href="#" class="source-link" onclick="showSource('${nodeId}', null); return false;">${nodeId} (View Context)</a>`;
            }

            // Validation List
            let valHtml = '';
            if (mat._validation && !mat._validation.is_valid) {
                valHtml = `<div style="background:#ffebee; color:#c62828; padding:1rem; border-radius:6px; margin-bottom:1rem;">
                    <strong>⚠️ Validation Issues:</strong>
                    <ul style="margin:0.5rem 0 0 1.5rem">${mat._validation.issues.map(i => `<li>${escape(i)}</li>`).join('')}</ul>
                </div>`;
            }

            let html = `
                <div class="detail-card">
                    <div class="detail-header">
                        <div class="detail-title">${escape(elName.acronym || elName.full_name || 'Unknown')}</div>
                        <div class="badges">
                            <span class="badge bg-class">${mat.material_class}</span>
                            <span class="badge" style="background:#f3e5f5; color:#7b1fa2">Conf: ${mat.confidence}</span>
                            <span class="badge" style="background:#eee; color:#333">${mat.data_source}</span>
                        </div>
                    </div>
                    
                    ${valHtml}
                    
                    <div class="prop-grid">
                        <div class="prop-box">
                            <div class="prop-label">Ionic Conductivity</div>
                            <div class="prop-value">
                                ${typeof mat._norm_cond === 'number' ? 
                                    `${mat._norm_cond.toExponential(2)} <span style="font-size:0.6em; color:#888">S/cm</span>` : 
                                    escape(mat.ionic_conductivity_S_per_cm)}
                            </div>
                            ${typeof mat._norm_cond === 'number' ? `<div class="prop-meta">Original: ${escape(mat.ionic_conductivity_S_per_cm)}</div>` : ''}
                        </div>
                        <div class="prop-box">
                            <div class="prop-label">Temperature</div>
                            <div class="prop-value">
                                ${typeof mat._norm_temp === 'number' ? 
                                    `${mat._norm_temp} <span style="font-size:0.6em; color:#888">°C</span>` : 
                                    escape(mat.measurement_temperature)}
                            </div>
                             ${typeof mat._norm_temp === 'number' ? `<div class="prop-meta">Original: ${escape(mat.measurement_temperature)}</div>` : ''}
                        </div>
                    </div>

                    ${mat.exact_quote ? 
                        `<div class="context-block" style="border-left:4px solid var(--primary); font-style:italic">
                            "${escape(mat.exact_quote)}"
                        </div>` : ''}

                    <div class="prop-label">Audit Details</div>
                    <table class="meta-table">
                        <tr><td>Source ID</td><td>${linkHtml}</td></tr>
                        <tr><td>Description</td><td>${escape(mat.material_description || '-')}</td></tr>
                        <tr><td>Processing</td><td>${escape(mat.processing_method || '-')}</td></tr>
                        <tr><td>Proportion</td><td>${escape(elName.proportion || '-')}</td></tr>
                    </table>
                </div>
            `;
            document.getElementById('detail-view').innerHTML = html;
        }

        // --- SOURCE MODAL LOGIC ---
        function showSource(targetId, contextId) {
            const targetNode = sourceMap[targetId];
            if (!targetNode) return;

            let displayNodeId = contextId;
            if (!displayNodeId && targetNode.parent_id) displayNodeId = targetNode.parent_id;
            if (!displayNodeId) displayNodeId = targetId;

            const displayNode = sourceMap[displayNodeId];
            let content = '';

            if (displayNode) {
                if (displayNode.type === 'image') {
                    content = `<div class="node-tag">Image Node: ${displayNodeId}</div>
                               <img src="${displayNode.src}" class="modal-img">
                               <div style="margin-top:0.5rem; font-style:italic">${escape(displayNode.text)}</div>`;
                } else {
                    let text = escape(displayNode.text);
                    if (targetId !== displayNodeId) {
                         const targetText = escape(targetNode.text);
                         if (targetText && text.includes(targetText)) {
                             text = text.replace(targetText, `<span class="highlight-target">${targetText}</span>`);
                         }
                    }
                    content = `<div class="node-tag">Context: ${displayNodeId} (${displayNode.type})</div>
                               <div class="context-block">${text}</div>`;
                }
            } else {
                content = "Parent context not found.";
            }

            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('sourceModal').style.display = 'flex';
        }

        function closeModal(e) {
            if (e) e.preventDefault();
            document.getElementById('sourceModal').style.display = 'none';
        }
        
        function escape(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.getElementById('search').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.mat-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(term) ? 'block' : 'none';
            });
        });
        
        // Initialize
        initPlot();
        if(materials.length > 0) selectMaterial(0);
        
    </script>
